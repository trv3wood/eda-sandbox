name: Rocky 8 container image

on:
  pull_request:
    paths:
      - Dockerfile.rocky8
      - env/rocky8-environment.yml
      - tools/uhdm_export/main.cpp
      - scripts/regress.sh
      - .github/workflows/rocky8-image.yml
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  rocky8:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/eda-enterprise:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rocky8
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}
          build-args: IMAGE_REVISION=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=rocky8
          cache-to: type=gha,mode=max,scope=rocky8
      - name: Smoke test
        run: docker run --rm "$IMAGE" bash /opt/eda-sandbox/scripts/regress.sh enterprise
      - name: Enforce image size
        run: |
          bytes="$(docker image inspect "$IMAGE" --format '{{.Size}}')"
          test "$bytes" -le "$((3500 * 1024 * 1024))"
      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE"
          repository="${IMAGE%:*}"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            docker tag "$IMAGE" "${repository}:main"
            docker push "${repository}:main"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker tag "$IMAGE" "${repository}:${GITHUB_REF_NAME}"
            docker tag "$IMAGE" "${repository}:latest"
            docker push "${repository}:${GITHUB_REF_NAME}"
            docker push "${repository}:latest"
          fi
