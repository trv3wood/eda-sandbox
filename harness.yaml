schema_version: 1
workspace: .
allowed_changes:
  - research/cycle-systemc-poc/**
  - docs/EVIDENCE.md
  - docs/MODEL_ARCH.md
  - docs/ai-cycle-level-systemc-research.md
  - task.md
  - harness.yaml
checks:
  - id: python-syntax
    category: syntax
    command: [python3, -m, compileall, -q, research/cycle-systemc-poc/tools]
  - id: host-configure
    category: build
    command: [cmake, -S, research/cycle-systemc-poc, -B, /tmp/eda-cycle-systemc-host-build, -DBUILD_SYSTEMC_POC=OFF, -DCMAKE_BUILD_TYPE=Release]
  - id: host-build
    category: build
    command: [cmake, --build, /tmp/eda-cycle-systemc-host-build, --parallel]
    depends_on: [host-configure]
  - id: host-test
    category: test
    command: [ctest, --test-dir, /tmp/eda-cycle-systemc-host-build, --output-on-failure]
    depends_on: [host-build]
  - id: circt-frontend
    category: custom
    command: [circt-verilog, --version]
  - id: circt-conversion
    category: custom
    command: [circt-opt, --version]
  - id: circt-emission
    category: custom
    command: [circt-translate, --version]
  - id: systemc-configure
    category: build
    command: [cmake, -S, research/cycle-systemc-poc, -B, /tmp/eda-cycle-systemc-full-build, -DBUILD_SYSTEMC_POC=ON, -DCMAKE_BUILD_TYPE=Release]
    required: false
  - id: systemc-build
    category: build
    command: [cmake, --build, /tmp/eda-cycle-systemc-full-build, --parallel]
    required: false
    depends_on: [systemc-configure]
  - id: systemc-test
    category: test
    command: [ctest, --test-dir, /tmp/eda-cycle-systemc-full-build, --output-on-failure]
    required: false
    depends_on: [systemc-build]
