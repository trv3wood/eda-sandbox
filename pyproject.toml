[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-modeling-harness"
version = "0.1.0"
description = "EDA tool discovery, change auditing, and verification harness"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
eda-harness = "eda_harness.cli:main"
eda-uhdm = "eda_query.uhdm_runtime:main"

[project.optional-dependencies]
rtl = [
  "pyslang>=9.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
